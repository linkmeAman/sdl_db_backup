name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Run container integration suite
      run: ./tests/integration/run.sh
    - name: Upload integration diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-results
        path: tests/integration/results/
        if-no-files-found: warn
        retention-days: 7
