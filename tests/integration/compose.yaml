x-mysql: &mysql
  image: mysql:8.0.43
  environment:
    MYSQL_ROOT_PASSWORD: integration-only-password
    MYSQL_ROOT_HOST: '%'
  healthcheck:
    test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -u root -e 'SELECT 1'"]
    interval: 3s
    timeout: 5s
    retries: 60
    start_period: 20s

x-postgres: &postgres
  image: postgres:16.10-bookworm
  environment:
    POSTGRES_PASSWORD: integration-only-password
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
    interval: 3s
    timeout: 5s
    retries: 60

services:
  mysql-source:
    <<: *mysql
  mysql-restore:
    <<: *mysql
  postgres-source:
    <<: *postgres
  postgres-restore:
    <<: *postgres
  # S3-compatible server with SigV4 verification. MinIO no longer publishes
  # community container images, so the previously pinned image cannot be pulled.
  # Metadata lives in a sidecar directory so the runner's filesystem need not
  # support extended attributes.
  s3:
    image: versity/versitygw:v1.8.0
    command: ["--access", "integration-access", "--secret", "integration-secret-password",
              "--port", ":9000", "posix", "--sidecar", "/meta", "/data"]
    volumes:
      - s3-data:/data
      - s3-meta:/meta
  suite:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile
    depends_on:
      mysql-source:
        condition: service_healthy
      mysql-restore:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
      postgres-restore:
        condition: service_healthy
      s3:
        condition: service_started
    volumes:
      - results:/results

# No host ports or host data mounts. Every invocation gets its own project and
# disposable database volumes; the wrapper removes them even on failure.
volumes:
  results:
  s3-data:
  s3-meta:
